---
name: Classify
run-name: Classify order ${{ inputs.order }}

# Regenerates the data file of one order: one job per diagonal type, then a job
# that combines the parts and opens a pull request with the new data.

on:
  workflow_dispatch:
    inputs:
      order:
        description: 'order of the magmas to classify'
        required: true
        type: number

permissions: {}

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      types: ${{ steps.types.outputs.types }}
    defaults:
      run:
        working-directory: classifier
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build antimagma
        run: make antimagma

      - name: List the diagonal types
        id: types
        run: |
          count=$(./antimagma -order ${{ inputs.order }} -list | sed -n 's/^  \([0-9]*\) types.*/\1/p')
          test -n "$count" || { echo "order ${{ inputs.order }} cannot be classified"; exit 2; }
          echo "types=[$(seq -s, 1 "$count")]" >> "$GITHUB_OUTPUT"

  classify:
    name: diagonal ${{ matrix.type }}
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        type: ${{ fromJSON(needs.plan.outputs.types) }}
    defaults:
      run:
        working-directory: classifier
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build antimagma
        run: make antimagma

      - name: Classify the tables with this diagonal
        run: |
          mkdir -p parts/${{ inputs.order }}
          ./antimagma -order ${{ inputs.order }} ${{ matrix.type }} -report > parts/${{ inputs.order }}/${{ matrix.type }}.keys

      - name: Upload the part
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: part-${{ inputs.order }}-${{ matrix.type }}
          path: classifier/parts/${{ inputs.order }}/${{ matrix.type }}.keys
          if-no-files-found: error

  combine:
    name: combine
    needs: classify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: classifier
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build antimagma and deltas
        run: make

      - name: Download the parts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: part-${{ inputs.order }}-*
          path: classifier/parts/${{ inputs.order }}
          merge-multiple: true

      - name: Combine the parts into the data file
        run: make combine ORDER=${{ inputs.order }}

      - name: Open a pull request with the new data
        env:
          GH_TOKEN: ${{ github.token }}
          ORDER: ${{ inputs.order }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ../data/$ORDER
          if git diff --cached --quiet; then
            echo "the data file of order $ORDER is unchanged; no pull request needed"
            exit 0
          fi
          branch="data/order-$ORDER-${{ github.run_id }}"
          git checkout -b "$branch"
          git commit -m "data: Regenerate order $ORDER with the classifier"
          git push origin "$branch"
          gh pr create --base "${{ github.ref_name }}" --head "$branch" \
            --title "data: Regenerate order $ORDER with the classifier" \
            --body "Regenerated by the Classify workflow, run ${{ github.run_id }}, one job per diagonal type."
