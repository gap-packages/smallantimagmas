---
name: Label management
run-name: label-management ${{ github.event.number }} ${{ github.event.pull_request.title }}

# pull_request_target runs with a write-scoped GITHUB_TOKEN even for fork PRs,
# which the labeling steps need. SECURITY: never check out or execute PR code
# in this workflow — that would let a fork PR escalate to the write token.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  statuses: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  label-auto:
    name: Labels - auto-create
    runs-on: ubuntu-latest
    steps:
      - uses: TimonVS/pr-labeler-action@f9c084306ce8b3f488a8f3ee1ccedc6da131d1af # v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/config.pull-request-label.yaml

  label-test:
    name: Labels - test
    needs: label-auto
    runs-on: ubuntu-latest
    steps:
      - uses: mheap/github-action-required-labels@23e10fde7e062233401931a0eece796cd9bf3177 # v5
        with:
          mode: exactly
          count: 1
          labels: |
            bug
            feature
            dependencies
            documentation
            release
