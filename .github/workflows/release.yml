# This workflow is responsible for making releases of this GAP package,
# and updating its website afterwards. For usage instructions, see
# <https://github.com/gap-actions/release-pkg/>.
name: Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run: only create an archive containing the release instead of publishing it on GitHub"
        type: boolean
        required: false
        default: false
      force:
        description: "Force: allow overwriting an existing release, or making a release with an incorrect date"
        type: boolean
        required: false
        default: false

permissions: write-all

jobs:
  release:
    name: "Release the GAP package"
    runs-on: ubuntu-slim

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: gap-actions/setup-gap@e2ba23b226e1f979b81600c153f6760f23db3bcf # v3
        with:
          gap-version: 'devel'
      - uses: gap-actions/build-pkg-docs@f1927364d4a2df557251a26afca0377edf1163ce # v2
        with:
          use-latex: true
      - uses: gap-actions/release-pkg@b1e40f56343129990436e5c86950dfe3f57421e6 # v1
        with:
          dry-run: ${{ inputs.dry-run }}
          force: ${{ inputs.force }}
      - uses: gap-actions/update-gh-pages@336470904efe0e9fb7413b399e887e9f0474c900 # v1
        if: ${{ !inputs.dry-run }}
